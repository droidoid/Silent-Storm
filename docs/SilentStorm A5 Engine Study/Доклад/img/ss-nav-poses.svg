<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" font-family="Segoe UI, Arial, sans-serif" font-size="13"><defs><marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs><rect width="900" height="372" fill="#ffffff"/><text x="20" y="28" font-size="15" text-anchor="start" fill="#222" font-weight="600">Проходимость по позам: шар радиусом 0,31 м на трёх высотах</text><rect x="20" y="300" width="860" height="10" fill="#8a8172"/><rect x="250" y="110" width="330" height="60" fill="#c9b79c" stroke="#6b5d48"/><text x="415" y="144.0" font-size="12" text-anchor="middle" fill="#333">балка, просвет под ней 1,3 м</text><circle cx="110" cy="141" r="31" fill="#8fc08a" fill-opacity="0.55" stroke="#444"/><text x="110" y="145.0" font-size="11" text-anchor="middle" fill="#222">стоя</text><text x="110" y="328" font-size="11" text-anchor="middle" fill="#555">центр на 1,59 м</text><circle cx="330" cy="141" r="31" fill="#e58a80" fill-opacity="0.55" stroke="#444"/><text x="330" y="145.0" font-size="11" text-anchor="middle" fill="#222">стоя ✕</text><circle cx="430" cy="202" r="31" fill="#8fc08a" fill-opacity="0.55" stroke="#444"/><text x="430" y="206.5" font-size="11" text-anchor="middle" fill="#222">присед</text><text x="430" y="328" font-size="11" text-anchor="middle" fill="#555">0,975 м</text><circle cx="530" cy="259" r="31" fill="#8fc08a" fill-opacity="0.55" stroke="#444"/><text x="530" y="263.0" font-size="11" text-anchor="middle" fill="#222">лёжа</text><text x="530" y="328" font-size="11" text-anchor="middle" fill="#555">0,41 м</text><rect x="660" y="260" width="90" height="40" fill="#b8ad98" stroke="#6b5d48"/><text x="705" y="252.0" font-size="11" text-anchor="middle" fill="#2e7d32">уступ 0,4 м: шаг</text><rect x="760" y="180" width="110" height="120" fill="#b8ad98" stroke="#6b5d48"/><text x="815" y="172.0" font-size="11" text-anchor="middle" fill="#b26a00">1,2 м: перелезание</text><text x="20" y="356" font-size="12" text-anchor="start" fill="#333">Под балкой клетка проходима только пригнувшись или ползком. Перепад до 0,55 м — шаг, от 0,55 до 2,8 м — перелезание.</text></svg>