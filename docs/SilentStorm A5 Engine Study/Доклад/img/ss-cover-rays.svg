" y="348" font-size="12" text-anchor="start" fill="#222">мимо цели: запас для промаха</text><text x="30" y="372" font-size="12" text-anchor="start" fill="#333">На рисунке в цель направлено 11 лучей: 3 дошли свободно, 4 пробили доски, 4 застряли в кирпиче.</text></svg>