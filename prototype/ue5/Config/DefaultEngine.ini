[/Script/EngineSettings.GameMapsSettings]
; No map of our own: the bench builds the scene in code inside the engine's empty map.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/SSProto.ProtoGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic light: Lumen for indirect light and reflections, virtual shadow maps, MegaLights for
; many shadow-casting lamps, hardware ray tracing where the GPU has it. No baked lighting at all.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.MegaLights.EnableForProject=True
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
